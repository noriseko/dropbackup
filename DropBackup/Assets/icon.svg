<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
	<!-- シールドのグラデーション -->
	<linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
	  <stop offset="0%"   stop-color="#1E90FF"/>
	  <stop offset="100%" stop-color="#0055CC"/>
	</linearGradient>
	<!-- 矢印のグラデーション -->
	<linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
	  <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
	  <stop offset="100%" stop-color="#D0E8FF" stop-opacity="1"/>
	</linearGradient>
	<!-- シールドのドロップシャドウ -->
	<filter id="shadow" x="-10%" y="-5%" width="120%" height="125%">
	  <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00000033"/>
	</filter>
  </defs>

  <!-- シールド本体 -->
  <path d="M128 18
			 L218 52
			 V128
			 C218 182 176 220 128 238
			 C80  220  38 182  38 128
			 V52
			 Z"
		fill="url(#shieldGrad)"
		filter="url(#shadow)"/>

  <!-- シールドのハイライト（上部の光沢） -->
  <path d="M128 30
			 L208 60
			 V100
			 C195 80 165 66 128 66
			 C91  66  61  80  48 100
			 V60
			 Z"
		fill="white" fill-opacity="0.18"/>

  <!-- シールドの内枠ライン -->
  <path d="M128 30
			 L208 60
			 V128
			 C208 176 170 212 128 228
			 C86  212  48 176  48 128
			 V60
			 Z"
		fill="none" stroke="white" stroke-opacity="0.25" stroke-width="2"/>

  <!-- 下向き矢印（ドロップを表現） -->
  <!-- 矢印の縦棒 -->
  <rect x="112" y="88" width="32" height="76" rx="10"
		fill="url(#arrowGrad)"/>
  <!-- 矢印の三角ヘッド -->
  <polygon points="128,192 86,148 170,148"
		   fill="url(#arrowGrad)"/>

  <!-- 下部の水平ライン（着地・保存を表現） -->
  <rect x="84" y="200" width="88" height="10" rx="5"
		fill="white" fill-opacity="0.85"/>
</svg>
